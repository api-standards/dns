name: DNS Apply

on:
  push:
    branches: [main]
    paths:
      - "zones/**"
      - "config/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: dns-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: octoDNS apply
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
        run: |
          if [ -z "$PORKBUN_API_KEY" ] || [ -z "$PORKBUN_SECRET_KEY" ]; then
            echo "::error::PORKBUN_API_KEY and/or PORKBUN_SECRET_KEY are empty. Add them as secrets on the repository or the 'production' environment."
            exit 1
          fi
          octodns-sync --config-file=config/octodns.yaml --doit
